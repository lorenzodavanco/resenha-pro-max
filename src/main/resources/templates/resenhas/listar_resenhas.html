<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resenhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" th:href="@{/resenhas}">Resenha Pro Max</a>
        </div>
    </nav>

    <main class="container">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center bg-white py-3">
                <h5 class="m-0">Histórico de resenhas</h5>
                <a class="btn btn-primary" th:href="@{/resenhas/nova}">+ Nova resenha</a>
            </div>
            <div class="card-body">
                <!-- pesquisa + ordenacao, mantem o que foi buscado -->
                <form class="row g-2 mb-3" method="get" th:action="@{/resenhas}">
                    <div class="col-md-3"><input class="form-control" name="lugar" th:value="${lugar}" placeholder="Pesquisar por lugar"></div>
                    <div class="col-md-3"><input class="form-control" name="pessoa" th:value="${pessoa}" placeholder="Pesquisar por pessoa"></div>
                    <div class="col-md-2">
                        <select class="form-select" name="campo">
                            <option value="dataHora" th:selected="${campo == 'dataHora'}">Data</option>
                            <option value="lugar" th:selected="${campo == 'lugar'}">Lugar</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="direcao">
                            <option value="desc" th:selected="${direcao == 'desc'}">Decrescente</option>
                            <option value="asc" th:selected="${direcao == 'asc'}">Crescente</option>
                        </select>
                    </div>
                    <div class="col-md-2"><button class="btn btn-outline-secondary w-100">Buscar</button></div>
                </form>

                <table class="table table-hover align-middle m-0">
                    <thead class="table-light">
                        <tr><th>Lugar</th><th>Endereço</th><th>Data</th><th>Presentes</th></tr>
                    </thead>
                    <tbody>
                        <!-- uma linha pra cada resenha -->
                        <tr th:each="r : ${resenhas}">
                            <td class="fw-semibold" th:text="${r.lugar}"></td>
                            <td class="text-muted" th:text="${r.endereco}"></td>
                            <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${r.presentes}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- modal do formulario, so aparece quando tem resenha no model (sem JS) -->
    <div class="modal d-block bg-dark bg-opacity-50" th:if="${resenha != null}">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" method="post" th:action="@{/resenhas/salvar}" th:object="${resenha}">
                <div class="modal-header">
                    <h5 class="modal-title">Nova resenha</h5>
                    <a class="btn-close" th:href="@{/resenhas}"></a>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Lugar *</label>
                        <input class="form-control" th:field="*{lugar}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Endereço</label>
                        <input class="form-control" th:field="*{endereco}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data e horário *</label>
                        <input class="form-control" type="datetime-local" th:field="*{dataHora}">
                    </div>
                    <div>
                        <label class="form-label">Presentes *</label>
                        <input class="form-control" th:field="*{presentes}" placeholder="Ex: Ana, João, Pedro">
                    </div>
                </div>
                <div class="modal-footer">
                    <a class="btn btn-outline-secondary" th:href="@{/resenhas}">Voltar</a>
                    <button class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
