<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resenhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" th:href="@{/resenhas}">Resenha Pro Max</a>
        </div>
    </nav>

    <main class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="m-0">Histórico de resenhas</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-light">
                        <tr><th>Lugar</th><th>Endereço</th><th>Data</th><th>Presentes</th></tr>
                    </thead>
                    <tbody>
                        <!-- uma linha pra cada resenha -->
                        <tr th:each="r : ${resenhas}">
                            <td class="fw-semibold" th:text="${r.lugar}"></td>
                            <td class="text-muted" th:text="${r.endereco}"></td>
                            <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${r.presentes}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
